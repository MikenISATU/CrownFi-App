name: Arcturus lifecycle

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "disable, enable, rollback, or remove"
        required: true
      confirm:
        description: "Type the service name to confirm"
        required: true

jobs:
  lifecycle:
    if: ${{ github.event.inputs.confirm == 'stellar-project' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lifecycle operation
        env:
          ARCTURUS_API_URL: http://127.0.0.1:9090
          ARCTURUS_BUNDLE: ${{ vars.ARCTURUS_BUNDLE }}
          ARCTURUS_DEPLOY_TOKEN: ${{ secrets.ARCTURUS_DEPLOY_TOKEN }}
        run: ./scripts/arcturus-service '${{ github.event.inputs.operation }}'
