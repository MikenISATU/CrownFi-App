name: Arcturus Destroy Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'destroy' to confirm"
        required: true
        default: ""

env:
  APP_NAME: "stellar-project"
  DOMAIN: "stellar-project.u128.org"

jobs:
  destroy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    steps:
      - name: 💥 Dispatch Destroy
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 600 \
            -X POST http://arcturus-deploy:8080/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "stack": "${{ env.APP_NAME }}",
              "action": "destroy",
              "domain": "${{ env.DOMAIN }}"
            }'
