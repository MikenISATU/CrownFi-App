name: Arcturus Deployment Pipeline

on:
  push:
    branches:
      - main

env:
  APP_NAME: "stellar-project"
  DOMAIN: "stellar-project.u128.org"
  TARGET_URL: "http://web:3000"
  TIER: "complex"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Build and Push Images
        run: |
          printf '%s' '${{ secrets.REGISTRY_TOKEN }}' | buildah login --username '${{ github.actor }}' --password-stdin git.u128.org
          
          # Build and push API
          buildah bud --no-cache -f services/api/Dockerfile -t git.u128.org/mprojects/stellar-project/api:latest .
          buildah push git.u128.org/mprojects/stellar-project/api:latest
          
          # Build and push Web
          buildah bud --no-cache -f web/Dockerfile -t git.u128.org/mprojects/stellar-project/web:latest .
          buildah push git.u128.org/mprojects/stellar-project/web:latest
          
          # Build and push DB-Init
          cat <<EOF > web/Dockerfile.db-init
          FROM git.u128.org/mprojects/stellar-project/web:latest
          CMD ["sh", "-c", "npx prisma db push && npm run seed"]
          EOF
          buildah bud --no-cache -f web/Dockerfile.db-init -t git.u128.org/mprojects/stellar-project/db-init:latest .
          buildah push git.u128.org/mprojects/stellar-project/db-init:latest

      - name: 🚀 Dispatch Deploy
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 600 \
            -X POST http://arcturus-deploy:8080/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "stack": "${{ env.APP_NAME }}",
              "action": "apply",
              "domain": "${{ env.DOMAIN }}",
              "deploy_trigger": "${{ github.sha }}"
            }'
